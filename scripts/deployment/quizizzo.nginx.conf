server {
    listen 80;
    listen [::]:80;
    server_name quizizzo.com www.quizizzo.com;

    return 301 https://quizizzo.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.quizizzo.com;

    ssl_certificate /etc/ssl/cloudflare/quizizzo.com.pem;
    ssl_certificate_key /etc/ssl/cloudflare/quizizzo.com.key;

    return 301 https://quizizzo.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name quizizzo.com;

    ssl_certificate /etc/ssl/cloudflare/quizizzo.com.pem;
    ssl_certificate_key /etc/ssl/cloudflare/quizizzo.com.key;

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
