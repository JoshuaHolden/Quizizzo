name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: true

jobs:
  quality:
    name: Build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install npm
        run: npm install --global npm@11.19.1

      - name: Install client dependencies
        run: npm ci

      - name: Audit client dependencies
        run: npm audit --audit-level=high

      - name: Build client assets
        run: npm run build:client

      - name: Run client tests
        run: npm run test:client

      - name: Validate JavaScript syntax
        run: find src/Quizizzo.Web/wwwroot/js -type f \( -name '*.js' -o -name '*.mjs' \) -print0 | xargs -0 -n1 node --check

      - name: Restore .NET dependencies
        run: dotnet restore Quizizzo.sln

      - name: Verify .NET analyzer style
        run: dotnet format style Quizizzo.sln --verify-no-changes --no-restore

      - name: Build .NET solution
        run: dotnet build Quizizzo.sln --configuration Release --no-restore --property:ContinuousIntegrationBuild=true

      - name: Run .NET tests
        run: dotnet test Quizizzo.sln --configuration Release --no-build --no-restore

  container:
    name: Build and publish production container
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write

    env:
      IMAGE_NAME: ghcr.io/joshuaholden/quizizzo

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Build production image
        run: |
          docker build \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --tag quizizzo:ci \
            .

      - name: Verify container runs as non-root
        run: test "$(docker image inspect quizizzo:ci --format '{{.Config.User}}')" = "app"

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish immutable commit image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          image_ref="${IMAGE_NAME}:sha-${GITHUB_SHA}"
          docker tag quizizzo:ci "${image_ref}"
          docker push "${image_ref}"
          echo "Published \`${image_ref}\`" >> "${GITHUB_STEP_SUMMARY}"
