name: quizizzo

services:
  quizizzo:
    image: ${QUIZIZZO_IMAGE:-quizizzo:local}
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: ${QUIZIZZO_ASPNETCORE_ENVIRONMENT:-Production}
      AllowedHosts: ${QUIZIZZO_ALLOWED_HOSTS:-localhost}
      Admin__Emails: ${QUIZIZZO_ADMIN_EMAILS:-mogawowo@gmail.com,joshua@mvc.tech}
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=quizizzo;Username=quizizzo;Password=${QUIZIZZO_POSTGRES_PASSWORD:?Set QUIZIZZO_POSTGRES_PASSWORD in .env};Maximum Pool Size=32;Connection Idle Lifetime=60"
      ConnectionStrings__Redis: "redis:6379,password=${QUIZIZZO_REDIS_PASSWORD:?Set QUIZIZZO_REDIS_PASSWORD in .env},abortConnect=false"
      DrawingAssets__RootPath: /app/assets/drawings
      VoiceSamples__RootPath: /app/assets/voice-samples
      DataProtection__KeyPath: /app/data-protection
      Logging__LogLevel__Default: Error
      Logging__LogLevel__Microsoft.AspNetCore: Error
    ports:
      - "127.0.0.1:${QUIZIZZO_HTTP_PORT:-8081}:8080"
    depends_on:
      asset-volumes:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - quizizzo-drawing-assets:/app/assets/drawings
      - quizizzo-voice-samples:/app/assets/voice-samples
      - quizizzo-data-protection:/app/data-protection
    networks:
      - quizizzo-private

  asset-volumes:
    image: ${QUIZIZZO_IMAGE:-quizizzo:local}
    user: root
    entrypoint: ["/bin/sh", "-c"]
    command: ["chown -R app:app /app/assets/drawings /app/assets/voice-samples /app/data-protection"]
    network_mode: none
    restart: "no"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - quizizzo-drawing-assets:/app/assets/drawings
      - quizizzo-voice-samples:/app/assets/voice-samples
      - quizizzo-data-protection:/app/data-protection

  migrate:
    image: ${QUIZIZZO_IMAGE:-quizizzo:local}
    profiles: ["tools"]
    command: ["--migrate=true"]
    environment:
      ASPNETCORE_ENVIRONMENT: ${QUIZIZZO_ASPNETCORE_ENVIRONMENT:-Production}
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=quizizzo;Username=quizizzo;Password=${QUIZIZZO_POSTGRES_PASSWORD:?Set QUIZIZZO_POSTGRES_PASSWORD in .env};Maximum Pool Size=32;Connection Idle Lifetime=60"
      Logging__LogLevel__Default: Error
      Logging__LogLevel__Microsoft.AspNetCore: Error
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - quizizzo-private

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: quizizzo
      POSTGRES_USER: quizizzo
      POSTGRES_PASSWORD: "${QUIZIZZO_POSTGRES_PASSWORD:?Set QUIZIZZO_POSTGRES_PASSWORD in .env}"
    volumes:
      - quizizzo-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quizizzo -d quizizzo"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - quizizzo-private

  redis:
    image: redis:8.2.8-alpine
    environment:
      REDIS_PASSWORD: "${QUIZIZZO_REDIS_PASSWORD:?Set QUIZIZZO_REDIS_PASSWORD in .env}"
    command: ["/bin/sh", "-c", "exec redis-server --save '' --appendonly no --requirepass \"$$REDIS_PASSWORD\""]
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$REDIS_PASSWORD redis-cli ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - quizizzo-private

volumes:
  quizizzo-postgres-data:
    name: quizizzo-postgres-data
  quizizzo-drawing-assets:
    name: quizizzo-drawing-assets
  quizizzo-voice-samples:
    name: quizizzo-voice-samples
  quizizzo-data-protection:
    name: quizizzo-data-protection

networks:
  quizizzo-private:
    name: quizizzo-private
    driver: bridge
