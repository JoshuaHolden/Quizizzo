name: quizizzo

services:
  quizizzo:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=quizizzo;Username=quizizzo;Password=${QUIZIZZO_POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:${QUIZIZZO_HTTP_PORT:-8081}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - quizizzo-private

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: quizizzo
      POSTGRES_USER: quizizzo
      POSTGRES_PASSWORD: ${QUIZIZZO_POSTGRES_PASSWORD}
    volumes:
      - quizizzo-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quizizzo -d quizizzo"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped
    networks:
      - quizizzo-private

volumes:
  quizizzo-postgres-data:
    name: quizizzo-postgres-data

networks:
  quizizzo-private:
    name: quizizzo-private
    driver: bridge
